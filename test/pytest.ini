[pytest]
qgis_qui_enabled=False
filterwarnings = ignore::FutureWarning

# Backstop for hangs the dialog watchdog cannot reach, such as a deadlock inside C++ code.
# Dumps the stack of every thread once a single test runs this long, so a hung run says where
# it stopped instead of being killed silently by the job timeout.
faulthandler_timeout = 120
