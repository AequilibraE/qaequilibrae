name: SecurityScan

# Mirrors the scan that plugins.qgis.org runs on every uploaded version, so a plugin release is
# never rejected by a finding that could have been caught here.
# https://plugins.qgis.org/docs/security-scanning

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set Python environment
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: x64

      - name: Install scanning tools
        run: python -m pip install --upgrade pip bandit detect-secrets flake8

      - name: Scan the packaged plugin
        run: python ci/security_scan.py
