name: DevelopmentTests

on:  [pull_request]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set Python environment
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install ruff==0.14.8

      - name: Lint with ruff
        run: ruff check
        
  unittest:
    needs: linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        container: ['qgis/qgis:latest']
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python3 -m venv /tmp/.venv --system-site-packages
          . /tmp/.venv/bin/activate
          python3 -m pip install -U pip setuptools uv
          python3 ./ci/dependency_installation.py
          python3 -m uv pip install -r test/requirements_test.txt
          export PYTHONPATH=$(pwd)/qaequilibrae/packages:$PYTHONPATH
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV

      - name: Run tests
        run: |
          . /tmp/.venv/bin/activate
          export QT_QPA_PLATFORM=offscreen
          pwd
          python3 -m pytest --cov-report term-missing --cov=qaequilibrae test
