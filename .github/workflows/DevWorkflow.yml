name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: '0 8 * * *'

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Python environment
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements_test.txt

      - name: Lint with ruff
        run: ruff check

      - name: Check formatting with ruff
        run: ruff format --check --diff

  unittest:
    needs: linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        container: ['qgis/qgis:latest', 'qgis/qgis:ltr']
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m venv /tmp/.venv --system-site-packages
          . /tmp/.venv/bin/activate
          qgis --version
          python3 -m pip install -U pip setuptools uv
          python3 ./ci/dependency_installation.py
          python3 -m uv pip install -r test/requirements_test.txt
          export PYTHONPATH=$(pwd)/qaequilibrae/packages:$PYTHONPATH
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV

      - name: Run tests
        run: |
          . /tmp/.venv/bin/activate
          export QT_QPA_PLATFORM=offscreen
          pwd
          python3 -m pytest --cov-report term-missing --cov=qaequilibrae test

  windows_test:
    needs: linting
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
      # We test the minimum LTR version required (Qt5) and the latest release (QGIS 4, Qt6).
      # QGIS 4 keeps its profiles under QGIS4\, while the 3.x line uses QGIS3\.
        version: [qgis, qgis-ltr --version=3.40.8]

    steps:
      - uses: actions/checkout@v7

      - name: Determine QGIS cache version
        id: qgis-version
        shell: pwsh
        run: |
          if ("${{ matrix.version }}" -eq "qgis") {
            $v = (choco info qgis --limit-output | Select-Object -First 1).Split('|')[1]
          } else {
            $v = "3.40.8"
          }
          "qgis_version=$v" >> $env:GITHUB_OUTPUT

      - name: Cache QGIS installation
        id: cache-qgis
        uses: actions/cache@v6
        with:
          path: C:\Program Files\QGIS*
          key: ${{ runner.os }}-qgis-${{ steps.qgis-version.outputs.qgis_version }}

      - name: Install QGIS on Chocolatey
        if: steps.cache-qgis.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install ${{ matrix.version }} -y

      # Currently skipping tests with relative path to test folder
      - name: Setup and test plugin on Latest
        shell: pwsh
        if: ${{ (matrix.version == 'qgis')}}
        run: |
          $qgisPath = (Get-ChildItem -Path "C:\Program Files" -Filter "QGIS*" -Directory).FullName
          $qgisExec = "$qgisPath\bin\python-qgis.bat"
          $pluginPath = "$env:APPDATA\QGIS\QGIS4\profiles\default\python\plugins"
          $aeqPath = "$pluginPath\qaequilibrae"
          Copy-Item "qaequilibrae" -Destination "$aeqPath" -Recurse
          Copy-Item "test" -Destination "$pluginPath\test" -Recurse
          $env:PYTHONPATH = "$qgisPath\apps\qgis\python"
          $env:QT_QPA_PLATFORM = "offscreen"
          $pip = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pip install -r $pluginPath\test\requirements_test.txt" -NoNewWindow -Wait -PassThru
          if ($pip.ExitCode -ne 0) { throw "Installing the test requirements failed (exit $($pip.ExitCode)); pytest cannot run without pytest-reportlog" }
          Set-Location "$aeqPath"
          $deps = Start-Process -FilePath "$qgisExec" -ArgumentList "download_extra_packages_class.py" -NoNewWindow -Wait -PassThru
          if ($deps.ExitCode -ne 0) { throw "Downloading the plugin dependencies failed (exit $($deps.ExitCode)); an empty packages folder crashes the interpreter during collection" }
          $aon = Get-ChildItem -Path "$aeqPath\packages\aequilibrae\paths\cython" -Filter "AoN*.pyd" -ErrorAction SilentlyContinue
          if (-not $aon) {
              Get-ChildItem -Path "$aeqPath\packages\aequilibrae\paths\cython" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              throw "AequilibraE installed without its compiled extensions - 'import aequilibrae.paths' will fail"
          }
          # uv reports success even when it resolves the wheels for a different interpreter, so the
          # ABI tag is the only thing that gives it away before conftest dies on the import
          $pyDir = (Get-ChildItem -Path "$qgisPath\apps" -Filter "Python3*" -Directory | Select-Object -First 1).Name
          $expected = "cp" + $pyDir.Substring(6)
          if ($aon.Name -notlike "*$expected*") {
              throw "AequilibraE was built for the wrong Python: got $($aon.Name), but QGIS runs $pyDir (expected $expected)"
          }
          Write-Host "AequilibraE compiled extension present: $($aon.Name) (matches $pyDir)"
          $env:PYTHONPATH = "$env:PYTHONPATH;$pluginPath;$aeqPath\packages"
          Set-Location "$pluginPath"
          $tests = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pytest test --report-log=$pluginPath\log.jsonl" -NoNewWindow -Wait -PassThru
          # 4 is a usage error, 5 is nothing collected - both mean pytest never got as far as a test
          Write-Host "pytest exited with $($tests.ExitCode)"

      - name: Setup and test plugin on LTR
        shell: pwsh
        if: ${{ (matrix.version != 'qgis')}}
        run: |
          $qgisPath = (Get-ChildItem -Path "C:\Program Files" -Filter "QGIS*" -Directory).FullName
          $qgisExec = "$qgisPath\bin\python-qgis-ltr.bat"
          $pluginPath = "$env:APPDATA\QGIS\QGIS3\profiles\default\python\plugins"
          $aeqPath = "$pluginPath\qaequilibrae"
          Copy-Item "qaequilibrae" -Destination "$aeqPath" -Recurse
          Copy-Item "test" -Destination "$pluginPath\test" -Recurse
          $env:PYTHONPATH = "$qgisPath\apps\qgis\python"
          $env:QT_QPA_PLATFORM = "offscreen"
          $pip = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pip install -r $pluginPath\test\requirements_test.txt" -NoNewWindow -Wait -PassThru
          if ($pip.ExitCode -ne 0) { throw "Installing the test requirements failed (exit $($pip.ExitCode)); pytest cannot run without pytest-reportlog" }
          Set-Location "$aeqPath"
          $deps = Start-Process -FilePath "$qgisExec" -ArgumentList "download_extra_packages_class.py" -NoNewWindow -Wait -PassThru
          if ($deps.ExitCode -ne 0) { throw "Downloading the plugin dependencies failed (exit $($deps.ExitCode)); an empty packages folder crashes the interpreter during collection" }
          $aon = Get-ChildItem -Path "$aeqPath\packages\aequilibrae\paths\cython" -Filter "AoN*.pyd" -ErrorAction SilentlyContinue
          if (-not $aon) {
              Get-ChildItem -Path "$aeqPath\packages\aequilibrae\paths\cython" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              throw "AequilibraE installed without its compiled extensions - 'import aequilibrae.paths' will fail"
          }
          # uv reports success even when it resolves the wheels for a different interpreter, so the
          # ABI tag is the only thing that gives it away before conftest dies on the import
          $pyDir = (Get-ChildItem -Path "$qgisPath\apps" -Filter "Python3*" -Directory | Select-Object -First 1).Name
          $expected = "cp" + $pyDir.Substring(6)
          if ($aon.Name -notlike "*$expected*") {
              throw "AequilibraE was built for the wrong Python: got $($aon.Name), but QGIS runs $pyDir (expected $expected)"
          }
          Write-Host "AequilibraE compiled extension present: $($aon.Name) (matches $pyDir)"
          $env:PYTHONPATH = "$env:PYTHONPATH;$pluginPath;$aeqPath\packages"
          Set-Location "$pluginPath"
          $tests = Start-Process -FilePath "$qgisExec" -ArgumentList "-m pytest test --report-log=$pluginPath\log.jsonl" -NoNewWindow -Wait -PassThru
          # 4 is a usage error, 5 is nothing collected - both mean pytest never got as far as a test
          Write-Host "pytest exited with $($tests.ExitCode)"

      - name: Check packages installed
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:APPDATA\QGIS\QGIS*\profiles\default\python\plugins\qaequilibrae\packages" -Name

      - name: Check if tests failed
        shell: pwsh
        run: |
          # The profile folder differs per matrix entry: QGIS 4 uses QGIS4\, the 3.x line QGIS3\
          $log = Get-ChildItem -Path "$env:APPDATA\QGIS\QGIS*\profiles\default\python\plugins\log.jsonl" -ErrorAction SilentlyContinue | Select-Object -First 1
          # No report at all means pytest died before running anything, which used to pass unnoticed
          if (-not $log) {
              Write-Error "No test report was produced - the test run did not complete"
              exit 1
          }
          $fails = Select-String -Path $log.FullName -Pattern 'failed'
          if ($fails.Matches.Length -gt 0) {
              Write-Error "Check for errors in the tests run"
              exit 1
          }
