[build-system]
requires = ["setuptools", "cython", "pyaml", "pyqt5", "requests", "scipy", "shapely", "pandas", "pyarrow", "pyproj"]

[tool.qgis-plugin-ci]
plugin_path = "qaequilibrae"
github_organization_slug = "aequilibrae"
project_slug = "qaequilibrae"

[tool.coverage.run]
omit = ["qaequilibrae/packages/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E203", "E266", "E501"]